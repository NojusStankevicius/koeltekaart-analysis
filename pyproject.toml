[project]
name = "koeltekaart-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NojusStankevicius" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.4",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "osmnx>=2.1.1",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[project.scripts]
koeltekaart-analysis = "koeltekaart_analysis:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
