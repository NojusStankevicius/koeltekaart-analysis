<title>Cooling Place Coverage</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f6f5f2; --panel:#ffffff; --sunk:#f3f2ee; --hover:#f7f6f3;
  --ink:#111110; --ink-2:#55544f; --ink-3:#8a8880;
  --line:#e3e1db; --line-2:#efede8;
  --blue:#2a78d6; --orange:#e5642c; --aqua:#16a06f; --mute:#a9a79e; --faint:#d9d6cd;
  --r1:#cde2fb; --r2:#9ec5f4; --r3:#6da7ec; --r4:#3987e5; --r5:#256abf; --r6:#104281;
  --o1:#fbe7d8; --o2:#f7c9a6; --o3:#f0a675; --o4:#e5804c; --o5:#cd5f2c; --o6:#a04318;
  --plan:#7a5af0;
  --grid-base:#eae8e2;
  --shadow:0 1px 2px rgba(17,17,16,.04),0 4px 14px rgba(17,17,16,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#111316; --panel:#181b1f; --sunk:#1f2227; --hover:#1d2025;
    --ink:#edece8; --ink-2:#a8a69f; --ink-3:#7b7972;
    --line:#2b2f36; --line-2:#23262c;
    --blue:#5c9bea; --orange:#f2814f; --aqua:#34c48f; --mute:#6f6d67; --faint:#3a3d43;
    --r1:#16304f; --r2:#1c4374; --r3:#245a9c; --r4:#2f76c6; --r5:#4b93e0; --r6:#7db4ee;
    --o1:#3a2a20; --o2:#5c3b28; --o3:#824f30; --o4:#a9663c; --o5:#cd8253; --o6:#eaa274;
    --plan:#9d85f5;
    --grid-base:#23262c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#111316; --panel:#181b1f; --sunk:#1f2227; --hover:#1d2025;
  --ink:#edece8; --ink-2:#a8a69f; --ink-3:#7b7972;
  --line:#2b2f36; --line-2:#23262c;
  --blue:#5c9bea; --orange:#f2814f; --aqua:#34c48f; --mute:#6f6d67; --faint:#3a3d43;
  --r1:#16304f; --r2:#1c4374; --r3:#245a9c; --r4:#2f76c6; --r5:#4b93e0; --r6:#7db4ee;
  --o1:#3a2a20; --o2:#5c3b28; --o3:#824f30; --o4:#a9663c; --o5:#cd8253; --o6:#eaa274;
  --plan:#9d85f5;
  --grid-base:#23262c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select{font:inherit; color:inherit}
.wrap{max-width:1480px; margin:0 auto; padding:24px 24px 40px}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.01em}

/* header ------------------------------------------------------------------ */
.top{display:flex; gap:16px 32px; align-items:center; justify-content:space-between;
  flex-wrap:wrap; margin-bottom:14px}
.top h1{font-size:20px; line-height:1.2}
.top p{margin:3px 0 0; color:var(--ink-2); font-size:13px}
.top-actions{display:flex; align-items:center; gap:8px}
.seg{display:inline-flex; padding:2px; gap:2px; background:var(--sunk);
  border:1px solid var(--line); border-radius:7px}
.seg button{padding:5px 12px; border:0; border-radius:5px; background:none;
  color:var(--ink-2); cursor:pointer; font-weight:500}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--panel);
  color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.iconbtn{width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--line);
  border-radius:7px; background:var(--panel); color:var(--ink-2); cursor:pointer}
.iconbtn:hover{color:var(--ink); border-color:var(--ink-3)}
.iconbtn svg{width:16px; height:16px}

/* KPI strip ---------------------------------------------------------------- */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:12px}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px;
  text-align:left; min-width:0}
.kpi .kl{color:var(--ink-2); font-size:12.5px}
.kpi .kv{font-size:22px; font-weight:600; letter-spacing:-.01em; line-height:1.2; margin-top:2px;
  display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.kpi .kd{font-size:12.5px; font-weight:500; color:var(--plan)}
.kpi .ks{color:var(--ink-3); font-size:12px; margin-top:1px}
button.kpi{cursor:pointer; font:inherit}
button.kpi:hover{border-color:var(--ink-3)}

/* shell ------------------------------------------------------------------- */
.shell{background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.walk{display:flex; align-items:center; gap:14px; margin-left:auto; margin-right:12px}
.walk > label{color:var(--ink-2); white-space:nowrap}
.walk output{font-weight:600; min-width:56px}
.slider{position:relative; width:300px; padding-bottom:14px; margin-top:12px}
input[type=range]{width:100%; margin:0; accent-color:var(--blue); display:block}
.ticks{position:absolute; left:8px; right:8px; bottom:0; height:12px}
.ticks button{position:absolute; transform:translateX(-50%); top:0; padding:0 2px; border:0;
  background:none; font-size:10.5px; line-height:12px; color:var(--ink-3); cursor:pointer}
.ticks button:hover,.ticks button[aria-current="true"]{color:var(--ink)}
.mapctl{position:absolute; right:12px; top:12px; z-index:5; display:flex; align-items:center; gap:8px;
  padding:6px 10px; border:1px solid var(--line); border-radius:8px; cursor:pointer; color:var(--ink-2);
  background:color-mix(in srgb,var(--panel) 92%,transparent); backdrop-filter:blur(4px)}
.zoomctl{position:absolute; right:12px; bottom:12px; z-index:5; display:flex; flex-direction:column;
  border:1px solid var(--line); border-radius:8px; overflow:hidden;
  background:color-mix(in srgb,var(--panel) 92%,transparent); backdrop-filter:blur(4px)}
.zoomctl button{width:30px; height:30px; display:grid; place-items:center; border:0; background:none;
  color:var(--ink-2); font:500 17px/1 inherit; cursor:pointer}
.zoomctl button + button{border-top:1px solid var(--line)}
.zoomctl button:hover:not(:disabled){color:var(--ink); background:var(--sunk)}
.zoomctl button:disabled{color:var(--ink-3); opacity:.45; cursor:default}
.zoomctl svg{width:12px; height:12px}
.mapctl input{accent-color:var(--blue); width:14px; height:14px; margin:0}
.mapctl:hover{color:var(--ink)}

.main{display:grid; grid-template-columns:minmax(0,1fr) 400px; height:100%}
.mapwrap{position:relative; min-width:0}
#cv{display:block; width:100%; height:auto}
#ov{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
#ov .venue,#ov .cand{pointer-events:auto}

.maplegend{position:absolute; left:12px; bottom:12px; display:grid; gap:8px;
  background:color-mix(in srgb,var(--panel) 92%,transparent); backdrop-filter:blur(4px);
  border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:11.5px; color:var(--ink-2);
  max-width:calc(100% - 24px)}
.scale{display:grid; gap:4px; width:232px}
.scale .st{color:var(--ink)}
.ramp{display:flex; border-radius:2px; overflow:hidden}
.ramp i{height:8px; flex:1}
.scalek{display:flex; color:var(--ink-3); font-size:10.5px}
.scalek span{flex:1; text-align:right; transform:translateX(50%)}
.scalek span:first-child{text-align:left; transform:none}
.keys{display:flex; gap:6px 14px; flex-wrap:wrap}
.lg{display:flex; align-items:center; gap:6px; white-space:nowrap}
.sw{width:10px; height:10px; border-radius:2px; flex:none}
.sw.dot{border-radius:50%; width:8px; height:8px}
.sw.ring{border-radius:50%; width:9px; height:9px; background:none; border:1.6px solid}

.preview{position:absolute; left:12px; top:12px; z-index:6; width:260px;
  background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow);
  padding:12px 14px}
.preview .pt{font-weight:600}
.preview .pm{color:var(--ink-3); font-size:12px}
.preview .pg{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 8px}
.preview .pv{font-size:18px; font-weight:600; line-height:1.15}
.preview .pv.a{color:var(--plan)} .preview .pv.b{color:var(--aqua)}
.preview .pl{font-size:11.5px; color:var(--ink-2)}
.preview .pf{border-top:1px solid var(--line-2); padding-top:8px; font-size:12px; color:var(--ink-2)}
.preview .pf b{color:var(--ink); font-weight:500}

.tip{position:absolute; pointer-events:none; z-index:7; background:var(--panel);
  border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow);
  padding:8px 10px; font-size:12px; min-width:170px; opacity:0; transition:opacity .08s}
.tip .t{font-weight:600; margin-bottom:4px; max-width:240px}
.tip .t span{color:var(--ink-3); font-weight:400}
.tip .r{display:flex; justify-content:space-between; gap:16px; color:var(--ink-2)}
.tip .r b{color:var(--ink); font-weight:500}

/* side panel -------------------------------------------------------------- */
/* The panel must not set the row height - the map does. Absolute inner box scrolls. */
.side{position:relative; border-left:1px solid var(--line); min-width:0}
.side-inner{position:absolute; inset:0; display:flex; flex-direction:column}
.tabs{display:flex; gap:18px; padding:0 16px; border-bottom:1px solid var(--line); flex:none}
.tabs button{padding:11px 0 9px; border:0; border-bottom:2px solid transparent; background:none;
  color:var(--ink-2); cursor:pointer; font-weight:500; display:flex; align-items:center; gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--ink)}
.badge{font-size:11px; line-height:16px; min-width:18px; padding:0 5px; border-radius:8px;
  background:var(--plan); color:#fff; text-align:center}
.filters{display:flex; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line-2); flex:none}
.search{flex:1; min-width:80px; padding:5px 9px; border:1px solid var(--line); border-radius:6px;
  background:var(--panel)}
.search::placeholder{color:var(--ink-3)}
.search:hover,select:hover{border-color:var(--ink-3)}
select{padding:5px 24px 5px 9px; border:1px solid var(--line); border-radius:6px; max-width:210px; min-width:0;
  background:var(--panel); cursor:pointer; appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%; background-size:4px 4px;
  background-repeat:no-repeat}
.filters select{flex:0 1 auto; max-width:128px}
.listhead{display:flex; justify-content:space-between; align-items:center; padding:6px 16px 6px;
  font-size:11.5px; color:var(--ink-3); flex:none; border-bottom:1px solid var(--line-2)}
.sortby{display:flex; align-items:center; gap:4px}
.sortby select{border-color:transparent; padding:2px 22px 2px 6px; font-size:12px; color:var(--ink); max-width:230px}
.showmore{display:block; width:calc(100% - 32px); margin:12px 16px; padding:7px; border:1px solid var(--line);
  border-radius:6px; background:var(--panel); color:var(--ink-2); cursor:pointer}
.showmore:hover{color:var(--ink); border-color:var(--ink-3)}
.cands + .showmore{width:100%; margin:10px 0 0}
.scroll{flex:1; min-height:0; overflow-y:auto}

.row{display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:0 10px; align-items:center;
  padding:8px 16px; cursor:pointer; border-bottom:1px solid var(--line-2)}

.row:hover{background:var(--hover)}
.row .rk{color:var(--ink-3); font-size:11.5px; text-align:right}
.row .rn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .rm{color:var(--ink-3); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .rv{text-align:right; font-weight:500}
.row .rb{width:64px; height:3px; margin-top:5px; margin-left:auto; background:var(--line-2); border-radius:2px}
.row .rb i{display:block; height:100%; border-radius:2px; background:var(--accent,var(--blue))}
.addbtn{width:24px; height:24px; display:grid; place-items:center; border-radius:6px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink-2); cursor:pointer; padding:0}
.addbtn:hover{border-color:var(--plan); color:var(--plan)}
.addbtn.on{background:var(--plan); border-color:var(--plan); color:#fff}
.addbtn svg{width:12px; height:12px}
.row.in-plan{background:color-mix(in srgb,var(--plan) 6%,transparent)}
.empty{color:var(--ink-3); padding:16px}

/* detail ------------------------------------------------------------------ */
.back{display:flex; align-items:center; gap:6px; padding:10px 16px; flex:none; width:100%;
  border:0; border-bottom:1px solid var(--line); background:none; color:var(--ink-2);
  cursor:pointer; text-align:left}
.back:hover{color:var(--ink); background:var(--hover)}
.detail{padding:16px}
.detail h2{font-size:16px}
.meta{color:var(--ink-2); margin-top:2px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.primary{margin-top:12px; width:100%; padding:7px 12px; border-radius:6px; cursor:pointer;
  border:1px solid var(--plan); background:var(--plan); color:#fff; font-weight:500}
.primary:hover{filter:brightness(1.08)}
.primary.on{background:var(--panel); color:var(--plan)}
.primary.drop{background:var(--panel); border-color:var(--line); color:var(--ink)}
.primary.drop:hover{border-color:var(--ink-3); filter:none}
.primary.drop.on{border-color:var(--plan); color:var(--plan)}
.detail .note{margin:6px 0 0; font-size:11.5px; color:var(--ink-3); line-height:1.45}
.row.out .rn{color:var(--ink-2); text-decoration:line-through; text-decoration-color:var(--ink-3)}
.planhead.sub{border-top:1px solid var(--line-2); margin-top:4px}
.kv .kvs{color:var(--ink-3); font-weight:400}
.sec{margin-top:20px}
.sec h3{font-size:12.5px; font-weight:600; margin-bottom:8px; display:flex; align-items:center;
  justify-content:space-between; gap:10px}
.sec h3 .seg{font-weight:500}
.sec h3 .seg button{padding:2px 8px; font-size:12px}
.kvt{width:100%; border-collapse:collapse}
.kvt td{padding:5px 0; border-bottom:1px solid var(--line-2)}
.kvt td:first-child{color:var(--ink-2)}
.kvt td:last-child{text-align:right}
.kvt tr.sub td:first-child{padding-left:14px}
.kvt tr.strong td{color:var(--ink); font-weight:600}
.kvt tr:last-child td{border-bottom:0}
.curve{width:100%; border-collapse:collapse}
.curve th{text-align:left; font-weight:400; color:var(--ink-2); width:64px; padding:3px 0}
.curve td{padding:3px 0}
.curve td.b i{display:block; height:6px; border-radius:1px; background:var(--accent,var(--blue)); opacity:.35}
.curve td.n{width:64px; text-align:right}
.curve tr.now th,.curve tr.now td.n{color:var(--ink); font-weight:600}
.curve tr.now td.b i{opacity:1}
.curve tr.avg th,.curve tr.avg td{border-top:1px solid var(--line-2); padding-top:6px; color:var(--ink-2)}
.cmp{display:grid; gap:7px}
.cmphead,.cmprow{display:grid; grid-template-columns:124px minmax(40px,1fr) 58px 50px; gap:10px; align-items:center}
.cmphead{color:var(--ink-3); font-size:11.5px}
.cmphead span:nth-child(n+3),.cmprow .v,.cmprow .d{text-align:right}
.cmprow .l{color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.track{position:relative; height:6px; background:var(--line-2); border-radius:1px}
.track .f{position:absolute; inset:0 auto 0 0; border-radius:1px; background:var(--blue)}
.track .c{position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; background:var(--ink)}
.cmprow .d{color:var(--ink-3); font-size:12px}
.cmprow .d.worse{color:var(--orange)}
.links{display:grid}
.link{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border:0;
  border-bottom:1px solid var(--line-2); background:none; cursor:pointer; text-align:left; width:100%}
.link:last-child{border-bottom:0}
.link span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2)}
.link:hover span:first-child{color:var(--blue); text-decoration:underline}
.more{color:var(--ink-3); margin-top:6px; font-size:12px}
.cands{margin:0 -16px}
.cands .row{padding:8px 16px}
.cands .row:first-child{border-top:1px solid var(--line-2)}

#chart{display:block; width:100%; height:auto}
.chartkeys{display:flex; gap:4px 14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); margin-top:4px}

/* plan -------------------------------------------------------------------- */
.plansum{padding:14px 16px; border-bottom:1px solid var(--line)}
.plansum .kvt tr.strong td:last-child{color:var(--plan)}
.planhead{display:flex; justify-content:space-between; align-items:center; padding:10px 16px 6px;
  font-size:11.5px; color:var(--ink-3)}
.textbtn{border:0; background:none; color:var(--ink-2); cursor:pointer; padding:2px 4px; border-radius:4px}
.textbtn:hover{color:var(--ink); background:var(--sunk)}

footer{margin-top:10px; color:var(--ink-3); font-size:11.5px; line-height:1.5}
footer p{margin:0}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Fit the window: the page is exactly one screen tall, the map takes whatever height is left and
   fits the city inside it. Below these sizes the page scrolls as a normal document. */
@media (min-width:1101px) and (min-height:640px){
  .wrap{height:100vh; height:100dvh; display:flex; flex-direction:column; padding-top:16px; padding-bottom:10px}
  .top,.kpis,footer{flex:none}
  .shell{flex:1; min-height:0; display:flex; flex-direction:column}
  .main{flex:1; min-height:0}
  #cv{position:absolute; inset:0; width:100%; height:100%!important}
  footer p{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
}
@media (max-width:1100px){
  .main{grid-template-columns:minmax(0,1fr)}
  .side{border-left:0; border-top:1px solid var(--line); height:620px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .wrap{padding:16px 16px 32px}
  .top h1{font-size:18px}
  .top-actions{width:100%}
  .top-actions .seg{flex:1}
  .top-actions .seg button{flex:1}
  .kpi{padding:12px}
  .kpi .kv{font-size:20px}
  .walk{flex-wrap:wrap; width:100%; gap:4px 12px; margin:0}
  .walk > label{order:-2}
  .walk output{order:-1; margin-left:auto; min-width:0}
  .slider{width:100%}
  .mapctl{top:8px; right:8px}
  .zoomctl{top:48px; bottom:auto; right:8px}
  .maplegend{position:static; border:0; border-top:1px solid var(--line); border-radius:0; max-width:none}
  .preview{display:none}
  .cmphead,.cmprow{grid-template-columns:104px minmax(30px,1fr) 54px 44px}
}
</style>
